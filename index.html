<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Horas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card-calculadora">

            <!-- TÍTULO -->
            <div class="card-header">
                <h1>Calculadora de Horas</h1>
            </div>

            <!-- CONTEÚDO -->
            <div class="conteudo-calculadora">

                <!-- ENTRADAS -->
                <div class="inputs">

                    <div class="cabecalho">
                        <span>Horas</span>
                        <span>Minutos</span>
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                </div>

                <!-- RESULTADO -->
                <div class="resultado-container">

                    <h2>Resultado</h2>

                    <div id="resultado">
                        00:00
                    </div>

                    <button id="btnLimpar">
                        Limpar
                    </button>

                </div>

            </div>



            <!-- ASSINATURA -->
            <div class="assinatura">

                <img src="assets/logo-gm.png" alt="Logo GM" class="logo-gm">

                <span>
                 Renan de Jesus | Calculadoras de Horas V1.7
                </span>

                <img src="assets/logo-manutencao.png" alt="Logo Manutenção" class="logo-manutencao">

            </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
