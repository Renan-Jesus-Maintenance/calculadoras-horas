<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Horas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

<body>

    <main class="container">

        <div class="card-calculadora">

            <div class="banner">

                <img src="assets/banner-industria.png" alt="Imagem Industrial">

                <div class="texto-banner">

                    <p>
                        Planejamento de recursos, cálculo de horas e apoio às operações de manutenção.
                    </p>
                </div>

            </div>
            <!-- TÍTULO -->
            <div class=" card-header">
                <h1>Calculadora de Horas</h1>
            </div>



            <!-- CONTEÚDO -->
            <div class=" conteudo-calculadora">

                <!-- ENTRADAS -->
                <div class="inputs">

                    <div class="cabecalho">
                        <span>Horas</span>
                        <span>Minutos</span>
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora">
                        <span>:</span>
                        <input type="number" class="minuto">
                    </div>

                </div>

                <!-- RESULTADO -->
                <div class="resultado-container">

                    <h2>Resultado</h2>

                    <div id="resultado">
                        00:00
                    </div>

                    <button id="btnLimpar">
                        Limpar
                    </button>

                </div>

            </div>



            <!-- ASSINATURA -->
            <div class="assinatura">

                <img src="assets/logo-gm.png" alt="Logo GM" class="logo-gm">

                <span>
                    © 2026 Renan de Jesus | Calculadora de Horas V1.7
                </span>

                <img src="assets/logo-manutencao.png" alt="Logo Manutenção" class="logo-manutencao">

            </div>

            <!-- BOTÃO SOBRE O PROJETO -->
            <div style="text-align:center; margin-top:20px;">

                <a href="sobre.html" class="btn-sobre">
                    Sobre o Projeto
                </a>

            </div>
            

    </main>

    <script src="script.js"></script>

</body>

</html>
